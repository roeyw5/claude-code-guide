<!DOCTYPE html>
<html lang="{{LANG}}" dir="{{DIR}}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{TITLE}}</title>
<style>
  :root {
    --text: #1a1d23;
    --text-soft: #4b5563;
    --muted: #6b7280;
    --bg: #f7f8fa;
    --card: #ffffff;
    --border: #e5e7eb;
    --border-soft: #eef0f3;
    --accent: #0d9488;
    --accent-deep: #0f766e;
    --accent-soft: #ccfbf1;
    --warn-bg: #fff7ed;
    --warn-border: #f97316;
    --info-bg: #eff6ff;
    --info-border: #2563eb;
    --ok-bg: #ecfdf5;
    --ok-border: #059669;
    --code-bg: #0f172a;
    --code-text: #e2e8f0;
    --shadow: 0 1px 2px rgba(15,23,42,.04), 0 4px 12px rgba(15,23,42,.04);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif;
    font-size: 17px;
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
  }
  /* RTL gets a Hebrew-aware system stack so the page picks up the OS Hebrew UI font. */
  html[dir="rtl"] body {
    font-family: "Segoe UI", Tahoma, Arial, -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
  }
  .wrap {
    max-width: 860px;
    margin: 0 auto;
    padding: 56px 24px 96px;
  }
  header.hero {
    text-align: start;
    margin-bottom: 40px;
  }
  .eyebrow {
    display: inline-block;
    background: var(--accent-soft);
    color: var(--accent-deep);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 5px 12px;
    border-radius: 999px;
    margin-bottom: 16px;
  }
  h1 {
    font-size: 38px;
    line-height: 1.2;
    margin: 0 0 14px;
    letter-spacing: -0.02em;
    font-weight: 700;
  }
  .lede {
    color: var(--text-soft);
    font-size: 18px;
    max-width: 640px;
    margin: 0;
  }
  h2 {
    font-size: 22px;
    line-height: 1.3;
    margin: 0 0 8px;
    letter-spacing: -0.005em;
    font-weight: 700;
  }
  h3 { font-size: 17px; margin: 24px 0 8px; }
  p { margin: 10px 0; }
  a { color: var(--accent-deep); text-decoration: underline; text-underline-offset: 2px; }
  a:hover { color: var(--accent); }
  ul, ol { padding-inline-start: 22px; }
  li { margin: 6px 0; }
  code {
    background: #eef2f7;
    border-radius: 4px;
    padding: 2px 7px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 0.9em;
    color: #0f172a;
    direction: ltr;
    unicode-bidi: embed;
  }
  pre {
    background: var(--code-bg);
    color: var(--code-text);
    border-radius: 10px;
    padding: 16px 18px;
    overflow-x: auto;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 14px;
    line-height: 1.6;
    margin: 12px 0;
    direction: ltr;
    text-align: left;
  }
  pre code { background: none; color: inherit; padding: 0; }

  /* "What you'll need" — 3-card row */
  .needs {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
    margin: 16px 0 8px;
  }
  .need-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px 18px 20px;
    box-shadow: var(--shadow);
  }
  .need-card h3 {
    font-size: 15px;
    margin: 0 0 6px;
    font-weight: 700;
  }
  .need-card p {
    margin: 0;
    font-size: 14px;
    color: var(--text-soft);
    line-height: 1.5;
  }

  /* Step cards. The two-column grid mirrors automatically under dir="rtl",
     so the circle ends up on the visually-leading side in both directions. */
  .step {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 26px 28px 24px;
    margin: 20px 0;
    box-shadow: var(--shadow);
    display: grid;
    grid-template-columns: 56px 1fr;
    gap: 22px;
    align-items: start;
  }
  .step-circle {
    width: 44px; height: 44px;
    border-radius: 50%;
    background: var(--accent);
    color: white;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700;
    font-size: 18px;
    flex-shrink: 0;
  }
  .step-body > h2 { margin-bottom: 10px; }
  .step-body > p:first-of-type { margin-top: 0; }

  /* Tables */
  table {
    width: 100%;
    border-collapse: separate;
    border-spacing: 0;
    margin: 12px 0;
    font-size: 15px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
  }
  th, td {
    text-align: start;
    padding: 10px 14px;
    border-bottom: 1px solid var(--border-soft);
    vertical-align: top;
  }
  tr:last-child td { border-bottom: 0; }
  th {
    font-weight: 600;
    color: var(--text-soft);
    background: #fafbfc;
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  /* Callouts. border-inline-start keeps the colored bar on the visually-leading
     side regardless of direction. */
  .callout {
    border-inline-start: 4px solid var(--info-border);
    background: var(--info-bg);
    padding: 12px 16px;
    border-radius: 10px;
    margin: 14px 0;
    font-size: 15px;
  }
  html[dir="ltr"] .callout { border-radius: 0 10px 10px 0; }
  html[dir="rtl"] .callout { border-radius: 10px 0 0 10px; }
  .callout.warn { border-color: var(--warn-border); background: var(--warn-bg); }
  .callout.ok { border-color: var(--ok-border); background: var(--ok-bg); }
  .callout-label {
    display: inline-block;
    font-weight: 700;
    margin-inline-end: 6px;
    text-transform: uppercase;
    font-size: 11px;
    letter-spacing: 0.06em;
    padding: 2px 8px;
    border-radius: 4px;
    background: rgba(0,0,0,0.06);
    color: var(--text);
    vertical-align: 2px;
  }
  .callout.warn .callout-label { background: rgba(249,115,22,.15); color: #9a3412; }
  .callout.ok .callout-label { background: rgba(5,150,105,.15); color: #065f46; }

  /* Accordion (for Troubleshooting and similar collapsible content) */
  details {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 16px;
    margin: 8px 0;
    box-shadow: var(--shadow);
  }
  details + details { margin-top: 8px; }
  summary {
    cursor: pointer;
    font-weight: 600;
    list-style: none;
    position: relative;
    padding-inline-end: 24px;
  }
  summary::-webkit-details-marker { display: none; }
  summary::after {
    content: "+";
    position: absolute;
    inset-inline-end: 4px;
    top: 50%;
    transform: translateY(-50%);
    font-weight: 400;
    color: var(--muted);
    font-size: 18px;
  }
  details[open] summary::after { content: "−"; }
  details > p { margin: 10px 0 4px; color: var(--text-soft); }

  .section-title {
    font-size: 13px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    margin: 48px 0 8px;
  }

  /* Optional: How-it-works CSS diagram. Claude emits this markup explicitly
     when it decides a plain section should become a diagram. */
  .diagram {
    display: grid;
    grid-template-columns: 1fr auto 1fr auto 1fr;
    align-items: center;
    gap: 10px;
    margin: 22px 0 8px;
  }
  .diagram-box {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 12px;
    text-align: center;
    box-shadow: var(--shadow);
  }
  .diagram-box .title { font-weight: 700; font-size: 15px; margin-bottom: 4px; }
  .diagram-box .sub { color: var(--muted); font-size: 12px; line-height: 1.3; }
  .diagram-box.middle { background: var(--accent-soft); border-color: var(--accent); }
  .diagram-arrow {
    color: var(--accent);
    font-weight: 700;
    font-size: 22px;
  }
  html[dir="rtl"] .diagram-arrow { transform: scaleX(-1); }

  @media (max-width: 720px) {
    h1 { font-size: 30px; }
    .needs { grid-template-columns: 1fr; }
    .step { grid-template-columns: 1fr; padding: 22px; }
    .diagram { grid-template-columns: 1fr; }
    .diagram-arrow { transform: rotate(90deg); justify-self: center; }
    html[dir="rtl"] .diagram-arrow { transform: rotate(90deg) scaleX(-1); }
  }
</style>
</head>
<body>
<div class="wrap">

{{BODY}}

</div>
</body>
</html>
